<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>.gmd Level Generator (Web)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 16px; line-height: 1.35; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin: 10px 0; }
    label { display:inline-flex; gap:8px; align-items:center; }
    input[type="range"], input[type="number"] { width: 220px; }
    input[type="number"] { width: 110px; padding: 6px; }
    button { padding: 10px 14px; border: 1px solid #ddd; background: #fff; border-radius: 10px; cursor: pointer; }
    button:hover { background:#f7f7f7; }
    .pill { padding: 4px 10px; border: 1px solid #ddd; border-radius: 999px; }
    pre { background:#fafafa; border:1px solid #eee; padding:10px; border-radius:10px; overflow:auto; max-height: 260px; }
    .warn { color:#8a2; }
    .err { color:#b11; }
  </style>
</head>
<body>
  <h2>Geometry Dash .gmd Generator (Website)</h2>

  <p>
    Generates a <code>.gmd</code> file (zlib-compressed, base64) you can import with tools like GDShare-style importers.
  </p>

  <div class="row">
    <label>Difficulty (1–10)
      <input id="difficulty" type="range" min="1" max="10" value="5" />
      <span class="pill" id="difficultyVal">5</span>
    </label>

    <label>Length (tiles)
      <input id="tiles" type="range" min="120" max="900" step="30" value="360" />
      <span class="pill" id="tilesVal">360</span>
    </label>

    <label>Seed
      <input id="seed" type="number" value="12345" />
    </label>

    <button id="newSeed">New Seed</button>
    <button id="download">Generate & Download .gmd</button>
  </div>

  <div class="row">
    <span class="pill">Objects: <b id="objCount">0</b></span>
    <span class="pill">Filename: <b id="fileName">level.gmd</b></span>
    <span id="status"></span>
  </div>

  <h3>Debug (first 400 chars of decoded payload)</h3>
  <pre id="debug">(generate to see)</pre>

  <!-- Pako (zlib/deflate). If you need offline-only, tell me and I’ll give you a no-CDN bundle. -->
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

  <script>
    // ----------------------------
    // Helpers
    // ----------------------------
    const $ = (id) => document.getElementById(id);

    function escapeStr(s) {
      // escape commas/colons
      return String(s).replaceAll(",", "\\,").replaceAll(":", "\\:");
    }

    function bytesToBase64(bytes) {
      // Convert Uint8Array to base64 safely in chunks
      let binary = "";
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode.apply(null, chunk);
      }
      return btoa(binary);
    }

    function base64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function zlibCompressToBase64(str) {
      // pako.deflate produces zlib-wrapped deflate by default (good for most .gmd variants)
      const input = new TextEncoder().encode(str);
      const compressed = window.pako.deflate(input);
      return bytesToBase64(compressed);
    }

    function zlibDecompressFromBase64(b64) {
      const bytes = base64ToBytes(b64);
      const decompressed = window.pako.inflate(bytes);
      return new TextDecoder().decode(decompressed);
    }

    // ----------------------------
    // "GMD" serializer (kS* + kA* arrays)
    // ----------------------------
    function createGmdString(level) {
      const meta = [];
      meta.push(`kS1:${escapeStr(level.name)}`);
      meta.push(`kS2:${escapeStr(level.desc || "")}`);
      meta.push(`kS3:${escapeStr(level.author || "Unknown")}`);
      meta.push(`kS4:${level.version ?? "1"}`);
      meta.push(`kS5:${level.song ?? 0}`);
      meta.push(`kS6:${escapeStr(level.bg || "#000000")}`);
      meta.push(`kS7:${escapeStr(level.gnd || "#ffffff")}`);
      meta.push(`kS8:${level.length ?? "5000"}`);
      meta.push(`kS9:${level.difficulty ?? "5"}`);
      meta.push(`kS10:${level.secretCoins ?? "0"}`);
      meta.push(`kS11:${level.featured ?? "0"}`);
      meta.push(`kS12:${level.official ?? "0"}`);
      meta.push(`kS13:${level.creatorID ?? "0"}`);
      meta.push(`kS14:${level.songVolume ?? "100"}`);
      meta.push(`kS15:${level.reserved ?? "0"}`);

      // Arrays kA1..kA15
      const kA = Array.from({ length: 15 }, () => []);

      for (const o of level.level) {
        kA[0].push(String(o.id ?? 0));                    // kA1
        kA[1].push(String(o.col ?? 0));                   // kA2
        kA[2].push(String((o.pos?.[0]) ?? 0));            // kA3 x
        kA[3].push(String((o.pos?.[1]) ?? 0));            // kA4 y

        let gid = o.gid;
        if (gid === "" || gid === null || gid === undefined) gid = -1;
        kA[4].push(String(gid));                          // kA5

        kA[5].push(String(o.lay ?? 1));                   // kA6

        let ext = String(o.ext ?? "");
        if (ext) ext = ext.replaceAll(",", "|");          // common converter behavior
        kA[6].push(ext);                                  // kA7

        kA[7].push(String(o.rot ?? 0));                   // kA8
        kA[8].push(String(o.scale ?? 1));                 // kA9
        kA[9].push(String(o.movx ?? 0));                  // kA10
        kA[10].push(String(o.movy ?? 0));                 // kA11
        kA[11].push(String(o.movd ?? 0));                 // kA12
        kA[12].push(String(o.movt ?? 0));                 // kA13
        kA[13].push(String(o.movdelay ?? 0));             // kA14
        kA[14].push("0");                                 // kA15 reserved
      }

      for (let i = 0; i < 15; i++) {
        meta.push(`kA${i+1}:${kA[i].join(",")}`);
      }

      return meta.join(",");
    }

    // ----------------------------
    // Simple level generator (blocks/spikes/gaps + rare portals)
    // ----------------------------
    // Object IDs (common in some community tooling; may vary by importer/mod)
    const OBJ_BLOCK = 1;
    const OBJ_SPIKE = 7;
    const OBJ_MINI_PORTAL = 101;
    const OBJ_NORMAL_PORTAL = 99;

    function rng(seed) {
      // Deterministic PRNG (Mulberry32)
      let t = seed >>> 0;
      return function() {
        t += 0x6D2B79F5;
        let x = t;
        x = Math.imul(x ^ (x >>> 15), x | 1);
        x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
    }

    function generateLevelObjects({seed, difficulty, tiles}) {
      const rnd = rng(seed);
      const objs = [];

      const tilePx = 100;
      const groundY = 0;

      const hazardProb = 0.05 + (difficulty * 0.015);     // ~0.065..0.20
      const maxGap = 1 + Math.floor(difficulty / 3);      // 1..4
      const platformChance = 0.03 + (difficulty * 0.005);

      let gapRemaining = 0;

      for (let i = 0; i < tiles; i++) {
        const x = i * tilePx;

        if (gapRemaining > 0) { gapRemaining--; continue; }

        // Start a gap sometimes
        if (rnd() < (0.03 + difficulty * 0.003)) {
          gapRemaining = 1 + Math.floor(rnd() * maxGap);
          continue;
        }

        // Ground block
        objs.push({
          id: OBJ_BLOCK, col: 1, pos: [x, groundY],
          gid: -1, lay: 1, ext: "", rot: 0, scale: 1,
          movx:0, movy:0, movd:0, movt:0, movdelay:0
        });

        // Spike
        if (rnd() < hazardProb) {
          objs.push({
            id: OBJ_SPIKE, col: 3, pos: [x, groundY + 30],
            gid: -1, lay: 1, ext: "", rot: 0, scale: 1,
            movx:0, movy:0, movd:0, movt:0, movdelay:0
          });
        }

        // Floating platform variation
        if (rnd() < platformChance) {
          objs.push({
            id: OBJ_BLOCK, col: 2, pos: [x + (tilePx/2), groundY + 120],
            gid: -1, lay: 1, ext: "", rot: 0, scale: 1,
            movx:0, movy:0, movd:0, movt:0, movdelay:0
          });
        }

        // Rare portal pair
        if (i > 40 && i % 160 === 0) {
          objs.push({
            id: OBJ_MINI_PORTAL, col: 1, pos: [x, groundY + 60],
            gid: -1, lay: 1, ext: "", rot: 0, scale: 1,
            movx:0, movy:0, movd:0, movt:0, movdelay:0
          });
          objs.push({
            id: OBJ_NORMAL_PORTAL, col: 1, pos: [x + 600, groundY + 60],
            gid: -1, lay: 1, ext: "", rot: 0, scale: 1,
            movx:0, movy:0, movd:0, movt:0, movdelay:0
          });
        }
      }

      return { objs, tilePx };
    }

    function buildLevel({seed, difficulty, tiles}) {
      const { objs, tilePx } = generateLevelObjects({seed, difficulty, tiles});
      return {
        name: `AI Gen (D${difficulty}) seed ${seed}`,
        desc: `Generated .gmd level (blocks/spikes/gaps).`,
        author: "Web Generator",
        version: "1",
        song: 0,
        bg: "#1a1a1a",
        gnd: "#333333",
        length: String(tiles * tilePx),
        difficulty: String(difficulty),
        secretCoins: "0",
        featured: "0",
        official: "0",
        creatorID: "0",
        songVolume: "100",
        reserved: "0",
        level: objs
      };
    }

    // ----------------------------
    // UI wiring
    // ----------------------------
    function syncUI() {
      $("difficultyVal").textContent = $("difficulty").value;
      $("tilesVal").textContent = $("tiles").value;
    }

    $("difficulty").addEventListener("input", syncUI);
    $("tiles").addEventListener("input", syncUI);

    $("newSeed").addEventListener("click", () => {
      // 32-bit unsigned seed
      $("seed").value = String((Math.random() * 0xFFFFFFFF) >>> 0);
    });

    $("download").addEventListener("click", () => {
      const status = $("status");
      status.className = "";
      status.textContent = "";

      if (!window.pako) {
        status.className = "err";
        status.textContent = "pako failed to load. (CDN blocked?)";
        return;
      }

      const difficulty = Number($("difficulty").value);
      const tiles = Number($("tiles").value);
      const seed = Number($("seed").value) >>> 0;

      const level = buildLevel({seed, difficulty, tiles});
      const gmdStr = createGmdString(level);
      const gmdB64 = zlibCompressToBase64(gmdStr);

      // Basic sanity: try decompressing and show first chunk
      let decodedPreview = "";
      try {
        const roundtrip = zlibDecompressFromBase64(gmdB64);
        decodedPreview = roundtrip.slice(0, 400);
      } catch (e) {
        status.className = "warn";
        status.textContent = "Generated, but local decompress check failed (importer might still work).";
      }

      $("debug").textContent = decodedPreview || "(no preview)";
      $("objCount").textContent = String(level.level.length);

      const filename = `level_D${difficulty}_seed${seed}.gmd`;
      $("fileName").textContent = filename;

      // Download as a text file containing the base64 payload
      const blob = new Blob([gmdB64], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      status.className = "";
      status.textContent = "✅ Downloaded .gmd";
    });

    syncUI();
  </script>
</body>
</html>
